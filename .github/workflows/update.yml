name: Daily data update

on:
  schedule:
    # Run every day at 02:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:  # allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect & clean arecanut prices
        run: |
          python -m src.collect --source csv --path data/raw/sample_arecanut.csv || true
          python -m src.clean data/raw/sample_arecanut.csv

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/
          git commit -m "chore: daily arecanut price update $(date +%F)" || true
          git push
